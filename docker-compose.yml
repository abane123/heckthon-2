services:
  # Local development only: MongoDB has no authentication and is bound to localhost.
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      # Keeps demo data across container restarts.
      - meeting-actions-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional browser UI; start with `docker compose --profile tools up -d`.
  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  meeting-actions-mongo-data:
